<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя домашняя работа</title>
    <style>
        table, td {
            border: 1px solid black;
        }
        td {
            width: 40px;
            height: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <table id="table"></table>
    <br>
    <button onclick="foo()">Добавить число</button>

    <script>
        var massiv = [];
        for (var i = 0; i < 30; i++) {
            var randomNum = Math.floor(Math.random() * 100);
            massiv.push(randomNum);
        }

        var tableHtml = document.getElementById("table");
        var k = 0; 
        
        for (var r = 0; r < 5; r++) {
            var row = "<tr>";
            for (var c = 0; c < 6; c++) {
                var currentNumber = massiv[k];
                if (currentNumber >= 50) {
                    row += "<td style='background-color: orange;'>" + currentNumber + "</td>";
                } else {
                    row += "<td>" + currentNumber + "</td>";
                }
                k++;
            }
            row += "</tr>";
            tableHtml.innerHTML += row;
        }

        function foo() {
            var newRandom = Math.floor(Math.random() * 100);
            var allRows = tableHtml.getElementsByTagName("tr");
            var lastRow = allRows[allRows.length - 1];
            var cellsInLastRow = lastRow.getElementsByTagName("td");
            
            var newCellHtml = "";
            if (newRandom >= 50) {
                newCellHtml = "<td style='background-color: orange;'>" + newRandom + "</td>";
            } else {
                newCellHtml = "<td>" + newRandom + "</td>";
            }
            
            if (cellsInLastRow.length === 6) {
                tableHtml.innerHTML += "<tr>" + newCellHtml + "</tr>";
            } else {
                lastRow.innerHTML += newCellHtml;
            }
        }
    </script>
</body>
</html>
